kind: Pod
apiVersion: v1
metadata:
  name: oomkilled-demo
spec:
  containers:
    - name: oom-test
      image: polinux/stress
      resources:
        requests:
          memory: "128Mi"
          cpu: "200m"
        limits:
          memory: "512Mi"
          cpu: "1"
      command:
          - stress
          - "--vm"
          - "1"
          - "--vm-bytes"
          - "1G"
          - "--vm-hang"
          - "1"
        
