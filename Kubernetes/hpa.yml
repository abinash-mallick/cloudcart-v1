kind: HorizontalPodAutoscaler
apiVersion: autoscaling/v2

metadata:
  name: hpa-cloudcart
  namespace: cloudcart-ns

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cloudcart-deployment

  minReplicas: 1
  maxReplicas: 5

  metrics:
    - type: Resource
      resource:
        name: cpu
        target: 
          type: Utilization
          averageUtilization: 50

