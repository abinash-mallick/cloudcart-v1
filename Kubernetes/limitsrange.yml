kind: LimitRange
apiVersion: v1

metadata:
  name: cloudcart-limitrange
  namespace: cloudcart-ns

spec:
  limits:

  - type: Container

    default:
      cpu: "500m"
      memory: "512Mi"
    defaultRequest:
      cpu: "200m"
      memory: "256Mi"
    max:
      cpu: "2"
      memory: "2Gi"
    min:
      cpu: "100m"
      memory: "64Mi"


