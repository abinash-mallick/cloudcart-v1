apiVersion: batch/v1
kind: CronJob

metadata:
  name: cloudcart-cronjob
  namespace: cloudcart-ns

spec:
  schedule: "*/1 * * * *"

  # Don't allow overlapping Jobs
  concurrencyPolicy: Forbid   #Values can be Allow, Forbid or Replace

  # Keep the last 3 successful Jobs
  successfulJobsHistoryLimit: 3

  # Keep the last 1 failed Job
  failedJobsHistoryLimit: 1

  # Allow a missed Job to start within 60 seconds
  startingDeadlineSeconds: 60

  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: cron-task
              image: busybox
              command:
                - sh
                - -c
                - echo "CloudCart CronJob executed at $(date)"

          restartPolicy: Never
