---

name: Builds, Scans and pushes the container image

on: 
 workflow_call:

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout code repository
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build the image
        run: docker build -t ${{ vars.DOCKERHUB_USERNAME }}/cloudcart:${{ github.sha }} .

      - name: Scan the image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ vars.DOCKERHUB_USERNAME }}/cloudcart:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'

      - name: Push the Docker image
        run: docker push ${{ vars.DOCKERHUB_USERNAME }}/cloudcart:${{ github.sha }}
